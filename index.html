<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Reservas</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
text-align:center;
background:rgba(255,255,255,0.08);
padding:50px;
border-radius:20px;
width:420px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h1{
font-size:32px;
margin-bottom:10px;
}

p{
opacity:0.9;
margin-bottom:30px;
}

button{
padding:15px 30px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
margin:10px;
transition:0.3s;
}

.login{
background:#22c55e;
color:white;
}

.cadastro{
background:#3b82f6;
color:white;
}

button:hover{
transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">
<h1>🏨 Controle de Reservas</h1>
<p>Sistema para gerenciamento de hospedagens</p>

<a href="login.html"><button class="login">Login</button></a>
<a href="cadastro.html"><button class="cadastro">Cadastrar</button></a>

</div>

</body>
</html>
